name = "needhave"
main = "src/worker.js"
compatibility_date = "2026-10-04"

# One D1 database. This file names the binding so two people wire the same Worker.
# database_id is a local placeholder. This repo does not create or deploy a remote D1.
[[d1_databases]]
binding = "DB"
database_name = "needhave"
database_id = "local-only-not-deployed"
migrations_dir = "migrations"

# Intake stays off until Rich sets Worker secrets. Do not put secret values here.
# AGENT_HOOK_SECRET — Bearer for POST /agent
# TIP_CREATE_SECRET — Bearer for POST /tips
# TURNSTILE_SECRET — optional; gates POST /intake
# TURNSTILE_SITEKEY — optional public widget key
# EMAIL_INTAKE — optional; any value enables email()
# EMAIL_FROM — optional From for secret replies
